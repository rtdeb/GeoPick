services:
  db:
    build: 
      context: .
      dockerfile: dockerfile-db
    restart: always
    volumes:      
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - ./.env
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
  
  api:
    build: 
      context: .
      dockerfile: dockerfile-api
    restart: always
    env_file:
      - ./.env
    depends_on:
      - db
    ports:
      - 3500:8000

  node:
    build: 
      context: .
      dockerfile: dockerfile-node
    env_file:
      - ./.env
    depends_on:
      - db
    command: sh -c "npm run build"
    ports:
      - 8085:8085      
    volumes:      
      - static_volume:/app/dist/

  web:
    image: nginx:alpine
    volumes:
      - static_volume:/usr/share/nginx/html:ro
    depends_on:
      - node
    ports:
      - "1337:80"


volumes:
  static_volume:
  postgres_data:
  